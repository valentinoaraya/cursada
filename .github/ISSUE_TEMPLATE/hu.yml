name: Historia de usuario
description: Se implementa con ODD. La spec se escribe si la historia es grande.
title: "HU-XXX: "
labels: []
body:
  - type: textarea
    id: historia
    attributes:
      label: Historia
      description: Como… quiero… para…
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Lista AC-XXX-NN. Si la historia es grande, la spec en docs/sdd se acepta antes de los tests.
      placeholder: |
        - AC-XXX-01:
    validations:
      required: true
  - type: checkboxes
    id: cadena
    attributes:
      label: Trazabilidad
      options:
        - label: Si la historia es grande, la spec está enlazada o se va a aceptar antes de los tests
        - label: docs/traceability.md se actualiza en el PR
