name: Historia de usuario
description: Recorre la cadena HU → spec → AC → BDD → tests → código
title: "HU-XXX: "
labels: []
body:
  - type: textarea
    id: historia
    attributes:
      label: Historia
      description: Como… quiero… para…
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Lista AC-XXX-NN. La spec en docs/sdd se escribe antes de los tests.
      placeholder: |
        - AC-XXX-01:
    validations:
      required: true
  - type: checkboxes
    id: cadena
    attributes:
      label: Trazabilidad
      options:
        - label: La spec está enlazada o se va a escribir antes de los tests
        - label: docs/traceability.md se actualiza en el PR
